server:
  port: ${GATEWAY_PORT:8888}

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: ${GATEWAY_DISCOVERY_LOCATOR:true}
          lower-case-service-id: true
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:5000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,refresh,env,gateway}
  endpoint:
    gateway:
      enabled: ${GATEWAY_ENDPOINT_ENABLED:true}
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}
