server:
  port: ${SEMESTRE_PORT:8094}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/BD_SEMESTRE
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}

integracion:
  curso:
    service-name: ${CURSO_SERVICE_NAME:ms-negocio-gestion-curso}
  docente:
    service-name: ${DOCENTE_SERVICE_NAME:ms-negocio-gestion-docente}
  timeout-ms: ${INTEGRACION_TIMEOUT_MS:3000}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SEMESTRE_DB_URL}
    username: ${SEMESTRE_DB_USER}
    password: ${SEMESTRE_DB_PASSWORD}
