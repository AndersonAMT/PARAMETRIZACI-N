server:
  port: ${PRODUCTO_PORT:8085}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/BD_PRODUCTO
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

inventario:
  max-unidades-por-movimiento: 1000  
  alerta-stock-bajo: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PRODUCTO_DB_URL}
    username: ${PRODUCTO_DB_USER}
    password: ${PRODUCTO_DB_PASSWORD}
