server:
  port: ${DOCENTE_PORT:8093}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/BD_DOCENTE
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}

gestion:
  docente:
    alerta-sin-correo: true         

---
spring:
  config:
    activate:
      on-profile: qa
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/BD_DOCENTE_QA

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DOCENTE_DB_URL}
    username: ${DOCENTE_DB_USER}
    password: ${DOCENTE_DB_PASSWORD}
