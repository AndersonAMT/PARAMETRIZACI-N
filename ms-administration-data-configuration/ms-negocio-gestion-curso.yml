server:
  port: ${CURSO_PORT:8092}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/BD_CURSO
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}

gestion:
  curso:
    max-creditos: 5                 
    alerta-credito-alto: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${CURSO_DB_URL}
    username: ${CURSO_DB_USER}
    password: ${CURSO_DB_PASSWORD}
