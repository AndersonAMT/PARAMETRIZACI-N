server:
  port: ${CONFIG_SERVER_PORT:8890}

spring:
  application:
    name: ms-administration-server-configuration

  # Backend del servidor: native (archivos locales) o git (repositorio versionado).
  # Se elige sin tocar el codigo:  $env:CONFIG_BACKEND="git"
  profiles:
    active: ${CONFIG_BACKEND:native}
  cloud:
    config:
      server:
        # --- Backend native (por defecto) ---
        native:
          # Ruta del repositorio de configuracion.
          # Override:  $env:CONFIG_REPO_PATH="file:///C:/taller/ms-administration-data-configuration"
          search-locations: ${CONFIG_REPO_PATH:file:../ms-administration-data-configuration}
        # --- Backend git (opcional, seccion 13 de la sesion) ---
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/carlo2086/taller_microservicio_java_2025}
          search-paths: ${CONFIG_GIT_SEARCH_PATHS:ms-administration-data-configuration}
          default-label: ${CONFIG_GIT_LABEL:main}
          clone-on-start: true
  # Clave simetrica para /encrypt y /decrypt. NUNCA se escribe aqui: se define
  # como variable de entorno ENCRYPT_KEY antes de arrancar el servidor.
